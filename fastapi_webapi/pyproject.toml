[project]
name = "api"
version = "1.0.0"
description = "Rest Api"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Base dependencies
    "python-dotenv>=1.2.1",
    "loguru>=0.7.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
    # Dataframes and Data Processing
    "polars>=1.35.1",
    # Database dependencies
    "asyncpg>=0.31.0",
    # Security dependencies
    "python-jose>=3.5.0",
    # LTP Labs dependencies
    "airpy>=3",
    # Uncategorized dependencies
    "langchain>=1.3.12",
    "langchain-openai>=1.3.4",
    # PDF parsing
    "pymupdf>=1.24.0",
    "pypdf>=5.0.0",
    "rapidocr>=3.0.0",
    "xlsxwriter>=3.2.9",
    "mlflow>=3.1",
    "azure-identity>=1.25.3",
    "deltalake>=1.6.2",
    "azure-storage-file-datalake>=12.25.0",
    "azure-storage-blob>=12.30.0",
    "rapidfuzz>=3.14.1",
    "onnxruntime>=1.29.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    # The test key-pair fixture imports cryptography directly; it otherwise arrives only
    # transitively, via azure-identity.
    "cryptography>=48.0.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "ruff>=0.14.3",
]

[tool.uv.sources]
airpy = { index = "ltpypi" }

[[tool.uv.index]]
name = "ltpypi"
url = "https://git.ltplabs.net/api/v4/projects/344/packages/pypi/simple"
explicit = true

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
