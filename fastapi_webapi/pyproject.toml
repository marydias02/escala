[project]
name = "api"
version = "1.0.0"
description = "Rest Api"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Base dependencies
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.0",
    "loguru>=0.7.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
    # Dataframes and Data Processing
    "polars>=1.35.1",
    # Database dependencies
    "asyncpg>=0.31.0",
    # Security dependencies
    "python-jose>=3.5.0",
    # Uncategorized dependencies
    "langchain>=1.3.12",
    "langchain-openai>=1.3.4",
    # PDF parsing
    "pymupdf>=1.24.0",
    "pypdf>=5.0.0",
    "rapidocr>=3.0.0",
    "xlsxwriter>=3.2.9",
    "mlflow>=3.1",
    "azure-identity>=1.25.3",
    "deltalake>=1.6.2",
    "azure-storage-file-datalake>=12.25.0",
    "azure-storage-blob>=12.30.0",
    "rapidfuzz>=3.14.1",
    "onnxruntime>=1.29.0",
    "langchain-google-genai>=4",
    "google-auth>=2.56.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    # The test key-pair fixture imports cryptography directly; it otherwise arrives only
    # transitively, via azure-identity.
    "cryptography>=48.0.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "ruff>=0.14.3",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

# Ship every package under src/, not just the one matching the project name.
[tool.uv.build-backend]
module-root = "src"
module-name = [
    "api",
    "config",
    "email_core",
    "invoice_extraction",
    "lakehouse_etl",
    "non_conformities_resolution",
    "payment_matching",
    "utils",
]
namespace = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
